source = $HOME/.config/hypr/colors/matugen-lock.conf


source = ~/.config/hypr/myColors.conf

$font = jetbrains
$clock_font = FlexRounded Bold
general {
    hide_cursor = fuals
}


animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    outer_color = $primary 45deg
    check_color = $secondary 120deg
    fail_color = $error 40deg

    font_color = rgb(143, 143, 143)
    fade_on_empty = false 
    rounding = 15

    font_family = $font
    placeholder_text = Input password...
    fail_text = $PAMFAIL

    # uncomment to use a letter instead of a dot to indicate the typed password
    # dots_text_format = *
    # dots_size = 0.4
    dots_spacing = 0.3

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, -380
    halign = center
    valign = center
}

# TIME (HOURS)
label {
    monitor =
    color = $primary
    text = cmd[update:60000] date +"%H"
    font_size = 175
    font_family = $clock_font

    position = 0, -240
    halign = center
    valign = top
}

# TIME (MINUTES)
label {
    monitor =
    color = $secondary   
    text = cmd[update:60000] date +"%M"
    font_size = 175
    font_family = $clock_font

    position = 0, -450
    halign = center
    valign = top
}


label {
    monitor =
    text = cmd[60000]  date +"%a, %B %d"
    font_size = 25
    font-family = $font
    color = $secondary
    position = 0, -750
    halign = center
    valign = top

}


